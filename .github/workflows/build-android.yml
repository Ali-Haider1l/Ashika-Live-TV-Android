name: Build Ashika Live TV Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare exact web player assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js style.css stream-refresh.js privacy-policy.html android/app/src/main/assets/

      - name: Validate source files
        run: |
          node --check app.js
          python3 -m json.tool appinfo.json >/dev/null
          test -s android/app/src/main/java/com/ashika/livetv/android/MainActivity.java

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashika-live-tv-android-v6.0.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
